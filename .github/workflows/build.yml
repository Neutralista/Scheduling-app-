name: Build & Distribute

on:
  push:
    branches: [claude/app-build-issues-mknbj6, main]
  pull_request:
    branches: [claude/app-build-issues-mknbj6, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Lint
        run: bash gradlew lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: bash gradlew testDebugUnitTest --stacktrace

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  build:
    name: Build, version, and release
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the version step reads the last release tag and the commits since.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > /tmp/waypoint.jks
            echo "SIGNING_STORE_PATH=/tmp/waypoint.jks" >> $GITHUB_ENV
          fi

      # Only a push to a real branch gets a release version — a pull_request build (which may
      # come from a fork with no secrets) just needs to prove it compiles, with the file's version.
      #
      # The version is worked out here, not committed: committing a bump and pushing it back to
      # the branch failed whenever another push landed first (the branch had moved), which
      # skipped the build and release. Name: the highest release tag (or the Gradle file's, if
      # higher), bumped minor when any commit since the last release starts with "feat", else
      # patch. Code: 1000 + the run number, so it always goes up and stays above the old
      # committed codes. Runs of this workflow don't overlap (concurrency above), so each one
      # sees the tag the previous one created.
      - name: Work out version
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          git fetch --tags --force --quiet
          FILE_VERSION=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          LAST_TAG=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$' | sort -V | tail -1)
          TAG_VERSION=${LAST_TAG#v}
          TAG_VERSION=${TAG_VERSION%-*}
          BASE=$(printf '%s\n%s\n' "$FILE_VERSION" "${TAG_VERSION:-0.0.0}" | sort -V | tail -1)
          # Commits since the last release, when its tag is on this branch's history; otherwise
          # just this push's commits.
          LAST_SHA=$(git rev-list -n1 "$LAST_TAG" 2>/dev/null || true)
          if [ -n "$LAST_SHA" ] && git merge-base --is-ancestor "$LAST_SHA" HEAD; then
            RANGE="$LAST_SHA..HEAD"
          elif git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            RANGE="$BEFORE_SHA..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          IFS='.' read -r major minor patch <<< "$BASE"
          if git log --format=%B "$RANGE" | grep -qiE '^(\* )?feat(\(.+\))?!?:'; then
            VERSION="$major.$((minor + 1)).0"
          else
            VERSION="$major.$minor.$((patch + 1))"
          fi
          CODE=$((1000 + ${{ github.run_number }}))
          echo "Version $VERSION ($CODE), from $BASE over $RANGE"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_ARGS=-PciVersionName=$VERSION -PciVersionCode=$CODE" >> $GITHUB_ENV

      - name: Build debug APK
        run: bash gradlew assembleDebug --stacktrace $VERSION_ARGS
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: waypoint-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Create GitHub pre-release with APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          # No target_commitish: the tag goes on the default branch's tip, which is this branch.
          # Pinning it to the built commit made GitHub refuse the release (403) whenever that
          # commit's workflow files differed from the tip's — this token can't tag those.
          tag_name: v${{ env.VERSION }}-${{ github.run_number }}
          name: "v${{ env.VERSION }} (build ${{ github.run_number }})"
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            Branch: `${{ github.ref_name }}`
            Commit: `${{ github.sha }}`

      # Keeps the three newest releases (the current one and two to roll back to, should a new
      # build break something) and deletes the rest along with their tags. The version step
      # only needs the newest tag.
      - name: Prune old releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 1000 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag \
              || echo "Couldn't delete $tag; the next run will retry."
          done
